
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docker Visit Counter | Muhyadin Elmi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0b1120;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: 100%;
      max-width: 620px;
      padding: 42px;
      background: #151e30;
      border: 1px solid #2b3850;
      border-radius: 20px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.2);
    }

    .label {
      color: #5eead4;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    h1 {
      margin: 18px 0;
      font-size: 38px;
      letter-spacing: -1.5px;
    }

    p {
      color: #a9b7cc;
      line-height: 1.7;
    }

    .counter {
      margin: 30px 0 8px;
      color: #5eead4;
      font-size: 84px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    button {
      margin-top: 20px;
      padding: 15px 24px;
      background: #5eead4;
      color: #08211e;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #99f6e4;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .details {
      margin-top: 35px;
      padding-top: 20px;
      border-top: 1px solid #2b3850;
      font-size: 13px;
    }

    .details p {
      overflow-wrap: anywhere;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #64748b;
    }

    @media (max-width: 600px) {
      .card {
        padding: 25px;
      }

      h1 {
        font-size: 30px;
      }

      .counter {
        font-size: 68px;
      }
    }
  </style>
</head>

<body>
  <main class="card">

    <div class="label">CoderCo · Docker Challenge</div>

    <h1>Docker Visit Counter</h1>

    <p>
      A multi-container application built with Python Flask,
      Redis, Docker Compose and NGINX load balancing.
    </p>

    <div class="counter" id="counter">—</div>

    <p>Total recorded visits</p>

    <button id="visitButton" onclick="recordVisit()">
      Record a Visit →
    </button>

    <section class="details">
      <p id="container">Container: Waiting for request</p>
      <p id="status">Status: Ready</p>
    </section>

    <div class="footer">
      Built by Muhyadin Elmi · DevOps Learning Journey
    </div>

  </main>

  <script>
    async function recordVisit() {
      const button = document.getElementById("visitButton");
      const status = document.getElementById("status");

      button.disabled = true;
      status.textContent = "Status: Sending request...";

      try {
        const response = await fetch("/count");

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const result = await response.text();

        const match = result.match(
          /^Visit count:\s*(\d+)\s*\|\s*Container:\s*(.+)$/
        );

        if (!match) {
          throw new Error("Unexpected response");
        }

        document.getElementById("counter").textContent = match[1];

        document.getElementById("container").textContent =
          "Container: " + match[2];

        status.textContent = "Status: Request successful";

      } catch (error) {
        status.textContent = "Status: " + error.message;

      } finally {
        button.disabled = false;
      }
    }
  </script>

</body>
</html>
